
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ordinary Museum</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">

        <p class="mb-4">AN EXPERIMENT IN CONTEMPORARY ART</p>

        <h1>The Ordinary Museum</h1>

        <p class="mb-5">
            Every object deserves an interpretation.
        </p>

        <form method="POST">
            <textarea name="prompt" rows="3"
                class="form-control"
                placeholder="Enter an everyday object..."
                required></textarea>

            <button type="submit" class="btn btn-primary">
                Enter the Exhibition
            </button>
        </form>

        <div id="loading" style="display:none;" class="mt-5">
            <p>CURATING YOUR EXHIBITION</p>
            <div class="loading-line"></div>
            <p class="mt-3"><i>Please remain in the gallery.</i></p>
        </div>

        {% if result %}
            <h3>Wall Label</h3>
            <div class="alert alert-secondary"
                 style="white-space: pre-line;">{{ result }}</div>
        {% endif %}

        {% if image %}
            <img src="data:image/png;base64,{{ image }}"
                 class="img-fluid mt-4"
                 alt="Generated Artwork">
        {% endif %}

    </div>

    <script>
        document.querySelector("form").addEventListener("submit", function() {
            document.getElementById("loading").style.display = "block";
        });
    </script>
</body>
</html>
